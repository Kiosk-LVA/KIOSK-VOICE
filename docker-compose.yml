version: '3.8'

services:
  v-tts:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./outputs:/app/outputs
      - v-tts-models:/root/.cache/v_tts
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  v-tts-models:
